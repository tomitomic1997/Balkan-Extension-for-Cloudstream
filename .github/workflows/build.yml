name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugins
        run: ./gradlew makePlugins json -PcloudstreamVersion=pre-release

      - name: Push to builds
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -B builds
          git add -f repo.json
          git add -f plugins.json
          git add -f *.cs3
          git commit -m "Build $GITHUB_SHA" || true
          git push -f origin builds
